{% extends 'base.html' %}
{% block title %}Recipe editor{% endblock %}{% block page %}recipe-form{% endblock %}
{% block content %}<div class="form-page"><a class="back-link" href="/recipes/">← Back to recipes</a><div class="form-heading"><p class="eyebrow">Recipe editor</p><h1 id="form-title">New recipe</h1><p class="subhead">Capture the details that make this one yours.</p></div><form id="recipe-form" class="panel editor-form"><div class="form-grid"><label class="wide">Title<input name="title" required maxlength="255"></label><label>Time in minutes<input name="time_minutes" type="number" min="1" required></label><label>Price<input name="price" type="number" min="0" step="0.01" required></label><label class="wide">Description<textarea name="description" rows="5" placeholder="What makes this recipe special?"></textarea></label><label class="wide">Source link<input name="link" type="url" placeholder="https://..."></label><label>Tags <small>Hold Ctrl/Cmd to choose several</small><select name="tags" id="tag-select" multiple></select><a class="inline-link" href="/library/">+ Add a tag in Library</a></label><label>Ingredients <small>Hold Ctrl/Cmd to choose several</small><select name="ingredients" id="ingredient-select" multiple></select><a class="inline-link" href="/library/">+ Add an ingredient in Library</a></label><label class="wide image-field">Recipe photo <small>Optional. You can also add one after saving.</small><input name="image" type="file" accept="image/*"></label></div><p id="form-message" class="message"></p><div class="form-actions"><a class="button ghost" href="/recipes/">Cancel</a><button class="button primary" type="submit">Save recipe <span>→</span></button></div></form></div>{% endblock %}
