{% extends 'base.html' %}
{% block title %}Profile{% endblock %}{% block page %}profile{% endblock %}
{% block content %}<div class="form-page narrow"><div class="form-heading"><p class="eyebrow">Your account</p><h1>Profile</h1><p class="subhead">Keep your account details up to date.</p></div><form id="profile-form" class="panel editor-form"><label>Name<input name="name" required maxlength="255"></label><label>Email<p id="profile-email" class="read-only"></p></label><label>New password <small>Leave blank to keep your current password.</small><input name="password" type="password" minlength="5" autocomplete="new-password"></label><p id="profile-message" class="message"></p><div class="form-actions"><button class="button primary" type="submit">Save changes <span>→</span></button></div></form></div>{% endblock %}
