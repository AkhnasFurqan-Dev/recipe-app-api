{% extends 'base.html' %}
{% block title %}Welcome{% endblock %}{% block page %}auth{% endblock %}
{% block content %}
<section class="auth-page"><div class="auth-copy"><p class="eyebrow">A quieter kitchen</p><h1>Recipes worth<br><em>returning to.</em></h1><p>Keep the meals you love organized, searchable, and ready for the next time you make them.</p></div><div class="panel auth-panel"><div class="auth-tabs"><button class="tab active" data-auth="login">Sign in</button><button class="tab" data-auth="register">Create account</button></div><form id="login-form" class="stack"><label>Email<input name="email" type="email" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="button primary" type="submit">Sign in <span>→</span></button></form><form id="register-form" class="stack hidden"><label>Name<input name="name" autocomplete="name" required></label><label>Email<input name="email" type="email" autocomplete="email" required></label><label>Password<input name="password" type="password" minlength="5" autocomplete="new-password" required></label><button class="button primary" type="submit">Create account <span>→</span></button></form><p id="auth-message" class="message"></p></div></section>
{% endblock %}
